<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Hospital AI Security{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
{% block body %}
<div class="topbar">
  <div class="brand">🛡 Hospital AI Security</div>
  <nav>
    {% if user %}
      <a href="{{ url_for('main.dashboard') }}">Dashboard</a>
      {% if user.role.name == 'admin' %}
        <a href="{{ url_for('main.admin_alerts') }}">Alerts</a>
        <a href="{{ url_for('main.admin_incidents') }}">Incidents</a>
        <a href="{{ url_for('main.audit_log_view') }}">Audit Log</a>
        <a href="{{ url_for('main.admin_users') }}">Users</a>
      {% endif %}
      <a href="{{ url_for('auth.logout') }}">Logout ({{ user.username }})</a>
    {% endif %}
  </nav>
</div>
<div class="container">
  {% block content %}{% endblock %}
</div>
{% endblock %}
</body>
</html>
